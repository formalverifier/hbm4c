<text x="805" y="276" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7a8a" text-anchor="middle">drain 128 writes before turning back</text>
<text x="14" y="280" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a6a7a">The DQ bus is bidirectional, so every direction change wastes ~12 ns. This is exactly why the direction FSM drains 128 writes at a time instead of interleaving per request.</text>

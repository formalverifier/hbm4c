<text x="14" y="630" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a6a7a">One 32-byte read. The controller echoes req_tag back as rsp_tag, so the host never has to track ordering. The red break is DRAM latency, not a stall.</text>
